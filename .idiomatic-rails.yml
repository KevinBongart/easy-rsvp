dead_code:
  exemptions:
    # Each entry names its caller. What is left is what the scan cannot
    # derive: a framework method that calls an override by name. Symbols in
    # option values — if:, by:, with: — are read now, so the six callback
    # entries that used to live here are gone.
    exempt:
      - name: blob_scope
        reason: "Overrides Active Storage's blob_scope, which ActiveStorage::SetBlob#set_blob calls."
      - name: perform
        reason: "Active Job calls EventSpamReviewJob#perform for perform_later."
      - name: scrub_attributes
        reason: "Overrides Rails::HTML::PermitScrubber#scrub_attributes, which its scrub method calls."
    computed_dispatch:
      - file: lib/organizer_token_redactor.rb
        reason: "public_send reads and writes the Honeybadger::Notice attributes in HONEYBADGER_NOTICE_FIELDS."
      - file: lib/production_database_pull.rb
        reason: "public_send reads host, port, username and password from the Active Record database config."
