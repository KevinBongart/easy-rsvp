version: 2.1
orbs:
  ruby: circleci/ruby@4.0.1 # https://circleci.com/orbs/registry/orb/circleci/ruby
  browser-tools: circleci/browser-tools@2.4.3
  node: circleci/node@7.2.1

jobs:
  build:
    docker:
      - image: cimg/ruby:4.0.10-node
        environment:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          RAILS_ENV: test
      - image: cimg/postgres:14.25
        environment:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
    executor: ruby/default
    steps:
      - checkout
      - run:
          name: Skip documentation-only build
          command: |
            if [[ "$CIRCLE_BRANCH" == "main" ]]; then
              base_revision=HEAD^
            else
              git fetch origin main
              base_revision="$(git merge-base HEAD origin/main)"
            fi

            if bin/docs-only-changes "$base_revision"; then
              circleci-agent step halt
            fi
      - node/install
      - ruby/install-deps
      - run:
          name: Refresh browser package index
          command: sudo apt-get update
      - browser-tools/install_firefox
      - browser-tools/install_geckodriver
      - run:
          name: Wait for DB
          command: 'dockerize -wait tcp://localhost:5432 -timeout 1m'
      - run:
          name: Set up database
          command: 'bundle exec rails db:create db:schema:load --trace'
      - run:
          name: Rails, assets, and all tests (including headless Firefox)
          command: bin/ci
      - store_test_results:
          path: tmp/test-results
      - store_artifacts:
          path: tmp/screenshots
          destination: browser-failures
  deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - add_ssh_keys
      - run:
          name: Configure Dokku remote
          command: |
            set -euo pipefail
            : "${DOKKU_HOST:?Set DOKKU_HOST in CircleCI project environment variables}"
            dokku_hostname="${DOKKU_HOST##*@}"
            if [[ ! "$dokku_hostname" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$ ]]; then
              echo 'DOKKU_HOST must contain a hostname, optionally prefixed by an SSH user' >&2
              exit 1
            fi
            ssh-keyscan "$dokku_hostname" >> ~/.ssh/known_hosts
            git remote add dokku "dokku@${dokku_hostname}:easy-rsvp"
      - run:
          name: Skip documentation-only deploy
          command: |
            set -euo pipefail
            # Compare with the revision Dokku runs, not HEAD^: the deploy
            # serial group skips older queued deploys, so the previous commit
            # may never have been deployed. Deploy whenever this is unknown.
            dokku_hostname="${DOKKU_HOST##*@}"
            deployed_sha="$(ssh -o BatchMode=yes "dokku@${dokku_hostname}" git:report easy-rsvp --git-sha 2>/dev/null | tr -d '[:space:]' || true)"
            if [[ "$deployed_sha" =~ ^[0-9a-f]{40}$ ]] \
              && git cat-file -e "${deployed_sha}^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$deployed_sha" HEAD; then
              if bin/docs-only-changes "$deployed_sha"; then
                echo "Only documentation changed since the deployed revision ${deployed_sha}."
                circleci-agent step halt
              fi
            else
              echo "Could not determine the deployed revision; deploying."
            fi
      - run:
          name: Deploy to Dokku
          command: git push dokku main

workflows:
  build-and-deploy:
    jobs:
      - build
      - deploy:
          # One deploy at a time across pipelines. When a newer main pipeline
          # is waiting or deploying, CircleCI skips older queued deploys
          # instead of running them, so merges in quick succession no longer
          # collide on Dokku's deploy lock or ship outdated revisions.
          serial-group: << pipeline.project.slug >>/deploy
          requires:
            - build
          filters:
            branches:
              only:
                - main
